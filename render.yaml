services:
  - type: web
    name: hubspot-zoho-integration
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: hubspot-zoho-db
          property: connectionString
      - key: HUBSPOT_ACCESS_TOKEN
        sync: false
      - key: HUBSPOT_PORTAL_ID
        sync: false
      - key: HUBSPOT_WEBHOOK_SECRET
        sync: false
      - key: HUBSPOT_CLOSED_WON_STAGE_ID
        value: closedwon
      - key: ZOHO_CLIENT_ID
        sync: false
      - key: ZOHO_CLIENT_SECRET
        sync: false
      - key: ZOHO_REFRESH_TOKEN
        sync: false
      - key: ZOHO_ORG_ID
        sync: false
      - key: ZOHO_REGION
        value: ae
      - key: ZOHO_REDIRECT_URI
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: API_KEY
        generateValue: true
      - key: VAT_RATE
        value: "0.05"
      - key: ZOHO_RATE_LIMIT_PER_MIN
        value: "60"
      - key: ZOHO_DAILY_LIMIT
        value: "2000"
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: ALERT_EMAIL
        sync: false

databases:
  - name: hubspot-zoho-db
    databaseName: integration
    user: integration_user
    plan: free

